<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>物质分类 · 学生学习交互原型</title>
  <style>
    :root{color-scheme:light;--ink:#172c42;--muted:#53687b;--line:#d5e2e5;--paper:#f6f9f7;--panel:#fff;--teal:#166958;--teal-dark:#0b4a40;--lime:#e7f3e8;--blue:#eaf1fb;--gold:#9b651e;--gold-bg:#fff4db}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #d18422;outline-offset:3px}a{color:var(--teal)}.shell{max-width:1180px;margin:auto;padding:0 24px 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}.brand{font-weight:800;letter-spacing:.03em;font-size:18px}.tag{font-size:12px;font-weight:700;color:var(--teal);background:#ddefe8;padding:4px 9px;border-radius:99px}.topnote{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:218px minmax(0,1fr);gap:32px;margin-top:28px}.rail{align-self:start;position:sticky;top:22px}.rail h2{font-size:13px;letter-spacing:.13em;color:var(--muted);margin:0 0 10px}.navbtn{display:block;width:100%;background:none;border:0;border-radius:12px;text-align:left;padding:10px 12px;color:var(--muted);margin:2px 0}.navbtn:hover,.navbtn.active{background:var(--lime);color:var(--teal-dark)}.navbtn.active{font-weight:750}.navbtn.visited:before{content:"✓ ";color:var(--teal)}.railfooter{margin-top:18px;padding:15px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}main{min-width:0}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--teal);text-transform:uppercase}.hero{padding:36px;border-radius:22px;background:#dff0e7;position:relative;overflow:hidden}.hero:after{content:"H₂O";position:absolute;right:30px;bottom:-45px;font-size:170px;font-weight:900;color:#c4e6d3;pointer-events:none}.hero>*{position:relative;z-index:1}.hero h1{font-size:clamp(30px,4vw,48px);line-height:1.18;max-width:720px;margin:12px 0}.lead{font-size:18px;max-width:720px;color:#39596b;margin:0 0 24px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0}.btn{border-radius:11px;border:1px solid var(--teal);background:var(--teal);color:white;padding:10px 17px;font-weight:720}.btn:hover{background:var(--teal-dark)}.btn.secondary{background:white;color:var(--teal)}.btn.quiet{border-color:var(--line);background:#fff;color:var(--ink)}.btn:disabled{opacity:.45;cursor:not-allowed}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;margin:18px 0;box-shadow:0 6px 24px rgba(29,70,68,.04)}.card h2{margin:3px 0 12px;font-size:clamp(25px,3vw,34px);line-height:1.25}.card h3{margin:10px 0}.card p{margin:8px 0 14px}.small{font-size:13px;color:var(--muted)}.crumb{font-size:13px;color:var(--muted);margin:2px 0 18px}.stephead{display:flex;justify-content:space-between;align-items:baseline;gap:15px}.stepcount{white-space:nowrap;color:var(--muted);font-size:13px}.samplegrid,.twocol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.sample{border:1px solid var(--line);border-radius:14px;padding:18px;background:#fff}.sample h3{margin:0 0 4px}.sample .formula{font-size:24px;font-weight:760}.sample.pick{width:100%;text-align:left}.sample.pick.selected{border:2px solid var(--teal);background:var(--lime)}.note{background:var(--blue);border-left:4px solid #537db2;padding:16px 18px;border-radius:7px;margin:18px 0}.remember{background:var(--gold-bg);border-left:4px solid var(--gold);padding:20px;border-radius:8px;margin:18px 0}.remember strong{color:#78480a}.imgwrap{background:#d8e9e0;border-radius:13px;overflow:hidden;padding:10px;text-align:center}.imgwrap img{display:block;width:100%;height:auto;max-height:550px;object-fit:contain;cursor:zoom-in}.figurecaption{font-size:12px;color:var(--muted);margin:8px 0}.segment{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.segment button{padding:8px 12px;border:1px solid var(--line);background:white;border-radius:8px}.segment button.active{background:var(--teal);color:#fff;border-color:var(--teal)}.relation{background:#f3f7fb;border:1px solid var(--line);padding:13px 16px;border-radius:10px;margin:12px 0;font-weight:650}.stepbox{border-left:3px solid #9ac7b3;padding:10px 16px;margin:10px 0;background:#f3faf6}.term{color:var(--teal);border:0;background:none;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;padding:0;font-weight:730}.answerlist{display:grid;gap:9px;margin:20px 0}.answerlist button{border:1px solid var(--line);text-align:left;background:#fff;padding:13px 17px;border-radius:11px}.answerlist button:hover,.answerlist button.selected{border-color:var(--teal);background:var(--lime)}.feedback{background:var(--lime);border:1px solid #9ac7b3;border-radius:14px;padding:19px;margin:18px 0}.feedback.wrong{background:#fff2e8;border-color:#e6bb89}.feedback strong{display:block;margin-bottom:6px}.feedback dl{display:grid;grid-template-columns:100px 1fr;gap:7px;margin:12px 0}.feedback dt{font-weight:800;color:#415d65}.feedback dd{margin:0}.footeractions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 60px}.statuslist{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.statuslist>div{background:#f4f7f8;border:1px solid var(--line);padding:15px;border-radius:11px}.questionrole{color:var(--gold);font-size:13px;font-weight:800}.lecture section{border-top:1px solid var(--line);padding:16px 0}.lecture section:first-child{border-top:0}.lecture h3{font-size:20px}.dialog{border:0;border-radius:18px;padding:0;max-width:min(650px,calc(100vw - 32px));width:100%;box-shadow:0 18px 55px rgba(12,35,48,.25)}.dialog::backdrop{background:#0a2239a8}.dialogbody{padding:25px}.dialoghead{display:flex;justify-content:space-between;gap:20px;align-items:start}.close{border:0;background:#eff4f2;border-radius:8px;padding:4px 12px;font-size:22px}.dialog img{width:100%;height:auto}.termgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.termgrid>div{padding:12px;background:#f5f8f6;border-radius:10px}.sr-only{position:absolute!important;height:1px;width:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.skip{position:absolute;left:-999px;top:8px;background:white;padding:8px}.skip:focus{left:10px;z-index:5}
    @media(max-width:800px){.shell{padding:0 16px}.layout{display:block}.rail{position:static;margin-bottom:18px}.rail nav{display:flex;overflow-x:auto;gap:4px}.rail h2,.railfooter{display:none}.navbtn{white-space:nowrap;width:auto;flex:none}.hero{padding:24px}.hero:after{font-size:100px;right:5px;bottom:-20px}.samplegrid,.twocol,.statuslist{grid-template-columns:1fr}.card{padding:20px}.topnote{display:none}.footeractions .btn{flex:1}.termgrid{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  </style>
</head>
<body>
  <a class="skip" href="#main">跳到学习内容</a>
  <div class="shell">
    <header class="top"><div class="brand">化学 · 从一个问题开始 <span class="tag">学生流程示范</span></div><span class="topnote">物质分类 · 可自由阅读与练习</span></header>
    <div class="layout">
      <aside class="rail" aria-label="课程步骤"><h2>本节路径</h2><nav id="steps"></nav><div class="railfooter">这里的勾只表示已经打开过该步骤；不表示掌握。</div></aside>
      <main id="main" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>
  <dialog id="info-dialog" class="dialog" aria-labelledby="dialog-title"><div class="dialogbody"><div class="dialoghead"><h2 id="dialog-title"></h2><button id="dialog-close" class="close" type="button" aria-label="关闭并返回课程">×</button></div><div id="dialog-content"></div></div></dialog>
  <script src="storyboard.js"></script>
</body>
</html>
