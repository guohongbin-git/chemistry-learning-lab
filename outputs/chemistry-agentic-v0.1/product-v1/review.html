<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <meta name="theme-color" content="#15294d">
  <title>内容审校台 · 化学学习实验室</title>
  <link rel="stylesheet" href="/product-v1/styles.css">
  <link rel="stylesheet" href="/product-v1/review.css">

<body>
  <main class="review-shell">
    <header class="review-topbar">
      <a class="review-back" href="/product-v1/">← 返回课程</a>
      <span class="status-pill">本地自查 · 草稿内容 · 待教师复核</span>
    </header>
    <section class="review-hero">
      <span class="eyebrow">内容质量记录 · 第一章</span>
      <h1>内容审校台</h1>
      <p>逐项查看 12 节短课、36 道短课原创题、12 道复习题，以及原有四个综合单元。勾选项只表示本机自查已记录，不能替代独立化学教师、教学或考试审校，也不会把课程发布。</p>
      <div class="review-hero-meta"><span id="revision-label"></span><span id="review-progress"></span><button class="button button-secondary" id="export-review" type="button">导出本机审校记录 JSON</button></div>
    </section>
    <aside class="review-boundary"><strong>审校边界</strong><p>所有练习都是课程自编。考法能力标签说明练习目标，不指向某一道历年真题；地区课标映射、来源授权与教师签审仍待完成。记录存放在当前浏览器，不含姓名字段。</p></aside>
    <div id="review-content" class="review-content"></div>
    <footer class="review-footer">即使所有本地自查项都勾完，状态仍显示“待教师复核”。本工作台没有发布或批准功能。</footer>
  </main>
</body>
</html>
